{# Shared date-range filter bar. Expects `args` (request.args) and `errors`. #}
{% if errors %}
  <ul class="error-list">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
{% endif %}

<form method="get" class="filter-bar">
  <label class="inline-label" for="date_from">From</label>
  <input type="date" id="date_from" name="date_from" value="{{ args.get('date_from', '') }}">
  <label class="inline-label" for="date_to">To</label>
  <input type="date" id="date_to" name="date_to" value="{{ args.get('date_to', '') }}">
  <button type="submit" class="btn">Apply</button>
  {% if args.get('date_from') or args.get('date_to') %}
    <a href="{{ request.path }}" class="btn btn-plain">All time</a>
  {% endif %}
</form>
